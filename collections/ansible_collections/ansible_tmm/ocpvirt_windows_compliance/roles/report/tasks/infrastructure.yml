---
# Report Role - Infrastructure Setup
# Creates PVC and nginx server to host reports via URL
# Only creates if not already present

- name: Check if reports PVC exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: compliance-reports
    namespace: "{{ tenant_namespace }}"
  register: reports_pvc

- name: Create reports PVC if not exists
  when: reports_pvc.resources | length == 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: compliance-reports
        namespace: "{{ tenant_namespace }}"
        labels:
          app: compliance-reports
          compliance.ocpvirt/component: reports-server
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

- name: Check if reports server deployment exists
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: compliance-reports-server
    namespace: "{{ tenant_namespace }}"
  register: reports_deployment

- name: Create reports server deployment if not exists
  when: reports_deployment.resources | length == 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compliance-reports-server
        namespace: "{{ tenant_namespace }}"
        labels:
          app: compliance-reports
          compliance.ocpvirt/component: reports-server
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: compliance-reports
        template:
          metadata:
            labels:
              app: compliance-reports
          spec:
            containers:
              - name: nginx
                image: registry.access.redhat.com/ubi8/nginx-120:latest
                ports:
                  - containerPort: 8080
                volumeMounts:
                  - name: reports
                    mountPath: /opt/app-root/src
                resources:
                  requests:
                    memory: "64Mi"
                    cpu: "50m"
                  limits:
                    memory: "128Mi"
                    cpu: "100m"
            volumes:
              - name: reports
                persistentVolumeClaim:
                  claimName: compliance-reports

- name: Create reports service if not exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: compliance-reports
        namespace: "{{ tenant_namespace }}"
        labels:
          app: compliance-reports
      spec:
        selector:
          app: compliance-reports
        ports:
          - port: 8080
            targetPort: 8080

- name: Create reports route if not exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: compliance-reports
        namespace: "{{ tenant_namespace }}"
        labels:
          app: compliance-reports
      spec:
        to:
          kind: Service
          name: compliance-reports
        port:
          targetPort: 8080
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Wait for reports server to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: compliance-reports-server
    namespace: "{{ tenant_namespace }}"
  register: reports_server_status
  until: >-
    reports_server_status.resources | length > 0 and
    reports_server_status.resources[0].status.readyReplicas | default(0) >= 1
  retries: 30
  delay: 5

- name: Get reports route URL
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: compliance-reports
    namespace: "{{ tenant_namespace }}"
  register: reports_route

- name: Set reports URL fact
  ansible.builtin.set_fact:
    reports_base_url: "https://{{ reports_route.resources[0].spec.host }}"

- name: Get reports server pod name
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ tenant_namespace }}"
    label_selectors:
      - app=compliance-reports
  register: reports_pods

- name: Set reports pod name fact
  ansible.builtin.set_fact:
    reports_pod_name: "{{ reports_pods.resources[0].metadata.name }}"
  when: reports_pods.resources | length > 0

- name: Display infrastructure status
  ansible.builtin.debug:
    msg: |
      Reports Infrastructure Ready
      ============================
      Pod: {{ reports_pod_name }}
      URL: {{ reports_base_url }}
