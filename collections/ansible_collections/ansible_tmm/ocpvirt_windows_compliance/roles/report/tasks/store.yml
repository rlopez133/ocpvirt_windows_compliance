---
# Report Role - Store Report
# Copies generated report to nginx server for web access

- name: Copy report to reports server
  kubernetes.core.k8s_cp:
    namespace: "{{ tenant_namespace }}"
    pod: "{{ reports_pod_name }}"
    local_path: "{{ report_path }}"
    remote_path: "/opt/bitnami/nginx/html/{{ report_filename }}"
    no_preserve: true

- name: Create index.html with report links
  kubernetes.core.k8s_exec:
    namespace: "{{ tenant_namespace }}"
    pod: "{{ reports_pod_name }}"
    command: >
      sh -c "ls -1 /opt/bitnami/nginx/html/*.html 2>/dev/null |
      while read f; do
        echo \"<li><a href='$(basename $f)'>$(basename $f)</a></li>\";
      done |
      (echo '<html><head><title>Compliance Reports</title></head><body><h1>Compliance Reports</h1><ul>'; cat; echo '</ul></body></html>') > /opt/bitnami/nginx/html/index.html"
  ignore_errors: true

- name: Display report URL
  ansible.builtin.debug:
    msg: |
      ==========================================
      REPORT AVAILABLE AT:
      {{ reports_base_url }}/{{ report_filename }}

      All Reports Index:
      {{ reports_base_url }}/
      ==========================================
