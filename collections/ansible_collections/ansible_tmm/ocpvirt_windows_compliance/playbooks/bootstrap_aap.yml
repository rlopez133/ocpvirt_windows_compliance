---
# Bootstrap AAP Playbook
# Creates credentials, project, inventory, and Compliance-Setup job template
# Uses infra.aap_configuration collection for AAP 2.5+
#
# Usage:
#   ansible-playbook bootstrap_aap.yml \
#     -e aap_hostname=https://aap-gateway.example.com \
#     -e aap_username=admin \
#     -e aap_password=secret \
#     -e ocp_api_url=https://api.cluster.example.com:6443 \
#     -e ocp_token=sha256~xxxx \
#     -e win_username=Administrator \
#     -e win_password=secret
#
# Optional parameters:
#   -e aap_validate_certs=true          # Validate AAP SSL certs (default: false)
#   -e ocp_validate_certs=true          # Validate OCP SSL certs (default: false)
#   -e project_branch=main              # Git branch for project (default: main)
#   -e organization=Default             # AAP organization (default: Default)
#   -e vm_namespaces='["namespace1"]'   # OpenShift namespaces with Windows VMs (default: ["vmimported-user1"])
#   -e tenant_namespace=compliance      # Namespace for compliance resources (default: compliance)
#
# Prerequisites:
#   ansible-galaxy collection install infra.aap_configuration
#   ansible-galaxy collection install ansible.controller
#   ansible-galaxy collection install ansible.platform
#   ansible-galaxy collection install ansible.eda
#   ansible-galaxy collection install ansible.hub

- name: Bootstrap AAP with Windows Compliance Collection
  hosts: localhost
  gather_facts: false

  vars:
    # AAP Connection (required via -e)
    # infra.aap_configuration uses aap_* variable names
    aap_hostname: ""
    aap_username: ""
    aap_password: ""
    aap_validate_certs: false

    # OpenShift Credential (required via -e)
    ocp_api_url: ""
    ocp_token: ""
    ocp_validate_certs: false

    # Windows Credential (required via -e)
    win_username: "Administrator"
    win_password: ""

    # Project settings
    project_repo: "https://github.com/rlopez133/ocpvirt_windows_compliance.git"
    project_branch: "main"
    organization: "Default"

    # Inventory settings
    vm_namespaces:
      - "vmimported-user1"
    tenant_namespace: "compliance"

    # Resource names
    aap_credential_name: "AAP Controller Credential"
    ocp_credential_name: "OpenShift Credential"
    win_credential_name: "Win VM"
    project_name: "Windows Compliance Collection"
    inventory_name: "Win VMs"
    inventory_source_name: "Windows VMs"
    job_template_name: "Compliance-Setup"
    localhost_inventory_name: "Demo Inventory"

    # infra.aap_configuration data structures
    controller_credentials:
      # AAP Controller Credential - for setup role to create job templates
      - name: "{{ aap_credential_name }}"
        description: "Credential for AAP API access - used by setup role to create job templates"
        organization: "{{ organization }}"
        credential_type: "Red Hat Ansible Automation Platform"
        inputs:
          host: "{{ aap_hostname }}"
          username: "{{ aap_username }}"
          password: "{{ aap_password }}"
          verify_ssl: "{{ aap_validate_certs }}"

      # OpenShift Credential - for Kubernetes API access
      - name: "{{ ocp_credential_name }}"
        description: "OpenShift API access for compliance namespace operations"
        organization: "{{ organization }}"
        credential_type: "OpenShift or Kubernetes API Bearer Token"
        inputs:
          host: "{{ ocp_api_url }}"
          bearer_token: "{{ ocp_token }}"
          verify_ssl: "{{ ocp_validate_certs }}"

      # Windows VM Credential - for Windows host access
      - name: "{{ win_credential_name }}"
        description: "Windows VM administrator access for compliance scanning and remediation"
        organization: "{{ organization }}"
        credential_type: "Machine"
        inputs:
          username: "{{ win_username }}"
          password: "{{ win_password }}"

    controller_projects:
      - name: "{{ project_name }}"
        description: "Windows VM STIG compliance scanning and remediation collection"
        organization: "{{ organization }}"
        scm_type: git
        scm_url: "{{ project_repo }}"
        scm_branch: "{{ project_branch }}"
        scm_clean: true
        scm_delete_on_update: false
        scm_update_on_launch: false

    controller_inventories:
      - name: "{{ inventory_name }}"
        description: "Windows VMs from OpenShift Virtualization"
        organization: "{{ organization }}"
        variables:
          ansible_connection: winrm
          ansible_winrm_transport: basic
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985

    controller_inventory_sources:
      - name: "{{ inventory_source_name }}"
        description: "Discover Windows VMs from OpenShift Virtualization"
        inventory: "{{ inventory_name }}"
        source: openshift_virtualization
        credential: "{{ ocp_credential_name }}"
        source_vars:
          namespaces: "{{ vm_namespaces }}"
        overwrite: false
        overwrite_vars: false
        update_on_launch: true

    controller_templates:
      - name: "{{ job_template_name }}"
        description: "Setup compliance infrastructure and create job templates"
        organization: "{{ organization }}"
        inventory: "{{ localhost_inventory_name }}"
        project: "{{ project_name }}"
        playbook: "collections/ansible_collections/ansible_tmm/ocpvirt_windows_compliance/playbooks/setup.yml"
        credentials:
          - "{{ aap_credential_name }}"
          - "{{ ocp_credential_name }}"
        extra_vars:
          tenant_config:
            name: "default"
            namespace: "{{ tenant_namespace }}"
            storage:
              backend: "pvc"
              pvc_name: "compliance-reports"
              pvc_size: "50Gi"
          aap_create_job_templates: true
          aap_job_template_organization: "{{ organization }}"
          aap_job_template_project: "{{ project_name }}"
          aap_credential_openshift: "{{ ocp_credential_name }}"
          aap_credential_windows: "{{ win_credential_name }}"
          aap_inventory_windows: "{{ inventory_name }}"
          aap_inventory_localhost: "{{ localhost_inventory_name }}"
          aap_playbook_path_prefix: "collections/ansible_collections/ansible_tmm/ocpvirt_windows_compliance/playbooks"
          eda_enabled: true
          eda_project_url: "{{ project_repo }}"
          eda_organization: "{{ organization }}"
          ocpvirt_compliance_enable_user_workload_monitoring: true
          ocpvirt_compliance_grafana_dashboards: true

  tasks:
    - name: Validate required AAP connection parameters
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_username | length > 0
          - aap_password | length > 0
        fail_msg: |
          Missing required AAP connection parameters.
          Required: aap_hostname, aap_username, aap_password

          Example:
            ansible-playbook bootstrap_aap.yml \
              -e aap_hostname=https://aap.example.com \
              -e aap_username=admin \
              -e aap_password=secret \
              ...

    - name: Validate required credential parameters
      ansible.builtin.assert:
        that:
          - ocp_api_url | length > 0
          - ocp_token | length > 0
          - win_password | length > 0
        fail_msg: |
          Missing required credential parameters.
          Required: ocp_api_url, ocp_token, win_password

          Example:
            ansible-playbook bootstrap_aap.yml \
              ...
              -e ocp_api_url=https://api.cluster.example.com:6443 \
              -e ocp_token=sha256~xxxx \
              -e win_username=Administrator \
              -e win_password=secret

    - name: Create credentials
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_credentials
      when: controller_credentials is defined

    - name: Create project
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_projects
      when: controller_projects is defined

    - name: Sync project to fetch playbooks
      ansible.controller.project_update:
        project: "{{ project_name }}"
        wait: true
        timeout: 300
        controller_host: "{{ aap_hostname }}"
        controller_username: "{{ aap_username }}"
        controller_password: "{{ aap_password }}"
        validate_certs: "{{ aap_validate_certs }}"
      when: controller_projects is defined
      register: project_sync_result

    - name: Create inventory
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_inventories
      when: controller_inventories is defined

    - name: Create inventory source
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_inventory_sources
      when: controller_inventory_sources is defined

    - name: Create job template
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_job_templates
      when: controller_templates is defined

    - name: Display bootstrap summary
      ansible.builtin.debug:
        msg: |
          =====================================================
          AAP Bootstrap Complete!
          =====================================================

          Credentials Created:
            - {{ aap_credential_name }}
            - {{ ocp_credential_name }}
            - {{ win_credential_name }}

          Project Created:
            - {{ project_name }} ({{ project_branch }})
            - Sync Status: {{ 'Completed' if project_sync_result is defined else 'Pending' }}

          Inventory Created:
            - {{ inventory_name }}
            - Source: {{ inventory_source_name }} (openshift_virtualization)
            - Namespaces: {{ vm_namespaces | join(', ') }}
            {# TODO: Remove after AAP validation - inventory sync variable no longer set #}
            - Sync Status: Skipped (run manually)

          Job Template Created:
            - {{ job_template_name }}

          Next Steps:
          -----------
          1. Run the '{{ job_template_name }}' job template to:
             - Deploy compliance infrastructure (Prometheus, Grafana, Pushgateway)
             - Create remaining job templates (Scan, Remediate, Report)
             - Configure EDA for automated remediation
